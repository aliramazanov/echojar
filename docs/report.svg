<svg xmlns="http://www.w3.org/2000/svg" width="806" height="177" viewBox="0 0 806 177" role="img" aria-label="echojar reporting one N+1 query and the line of code that caused it">
<title>echojar reporting one N+1 query and the line of code that caused it</title>
<rect width="806" height="177" rx="8" fill="#0d1117" stroke="#30363d"/>
<circle cx="26" cy="19" r="5" fill="#ff5f56"/>
<circle cx="44" cy="19" r="5" fill="#ffbd2e"/>
<circle cx="62" cy="19" r="5" fill="#27c93f"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" text-rendering="geometricPrecision" xml:space="preserve">
<text x="24" y="57" fill="#7d8590">$ java -javaagent:echojar.jar -jar shop.jar</text>
<text x="24" y="86" fill="#e6edf3">echojar: 1 echo in 1 call site</text>
<text x="24" y="115" fill="#79c0ff">  select i1_0.order_id,i1_0.id,i1_0.quantity,i1_0.sku from order_item i1_0 where i1_0.order_id=?</text>
<text x="24" y="134" fill="#f0883e">    40 executions in one connection lease</text>
