name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress --strict-checksums verify

      - name: Check the agent jar carries its bootstrap
        shell: bash
        run: |
          jar=target/echojar.jar
          [ -f "$jar" ] || { echo "$jar was not produced"; exit 1; }
          jar tf "$jar" | grep -q 'com/aliramazanov/echojar/echojar-bootstrap.jar' \
            || { echo "the bootstrap jar is missing from the agent jar"; exit 1; }
          if jar tf "$jar" | grep -q 'com/aliramazanov/echojar/bootstrap/.*\.class'; then
            echo "bootstrap classes leaked into the agent jar, they would load twice"
            exit 1
          fi

      - name: Check nothing unexpected ships in the jar
        shell: bash
        run: |
          jar=target/echojar.jar
          if jar tf "$jar" | grep -qiE '\.(dll|so|dylib)$'; then
            echo "a native binary is being shipped inside the agent jar"
            jar tf "$jar" | grep -iE '\.(dll|so|dylib)$'
            exit 1
          fi
          stray=$(jar tf "$jar" | grep '\.class$' | grep -v '^com/aliramazanov/echojar/' || true)
          if [ -n "$stray" ]; then
            echo "classes outside com/aliramazanov/echojar/ are being shipped unrelocated"
            echo "$stray"
            exit 1
          fi
          deps=$(mvn --batch-mode --no-transfer-progress dependency:list \
            | grep -E '^\[INFO\]    [a-z].*:(compile|runtime)' \
            | sed 's/^\[INFO\] *//' | cut -d: -f1-2 | sort)
          expected='net.bytebuddy:byte-buddy'
          if [ "$deps" != "$expected" ]; then
            echo "the set of dependencies shipped into user JVMs changed"
            echo "expected: $expected"
            echo "found:    $deps"
            exit 1
          fi

      - name: Smoke test the agent and the CLI
        shell: bash
        run: |
          java -jar target/echojar.jar list > /dev/null
          java -javaagent:target/echojar.jar=threshold=3,framework=com.aliramazanov.echojar.fake. \
            -cp target/test-classes shop.HotPath 2>&1 | tee agent.out
          grep -q 'echo in 1 call site' agent.out \
            || { echo "the agent did not report the planted echo"; exit 1; }

      - name: Check the build is reproducible
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          first=$(sha256sum target/echojar.jar | cut -d' ' -f1)
          mvn --batch-mode --no-transfer-progress --strict-checksums clean package -DskipTests
          second=$(sha256sum target/echojar.jar | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            echo "two builds of the same source produced different jars, so a release cannot be verified"
            echo "first:  $first"
            echo "second: $second"
            exit 1
          fi
          echo "rebuild is byte for byte identical: $first"

      - name: Upload the agent jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: echojar
          path: target/echojar.jar
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
