name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress --strict-checksums verify

      - name: Check the tag matches the version that was built
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version=$(unzip -p target/echojar.jar \
            META-INF/maven/com.aliramazanov/echojar/pom.properties | sed -n 's/^version=//p' | tr -d '\r')
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the built version $version"
            exit 1
          fi
          echo "tag $TAG matches the built jar"

      - name: Check the jar is runnable
        run: |
          java -jar target/echojar.jar list > /dev/null
          unzip -l target/echojar.jar | grep -q 'echojar-bootstrap.jar'

      - name: Attest that this jar was built by this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/echojar.jar

      - name: Write the checksum
        run: sha256sum target/echojar.jar | sed 's| .*/| |' > target/echojar.jar.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            target/echojar.jar \
            target/echojar.jar.sha256
