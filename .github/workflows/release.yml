name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag looks like a version
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$TAG is not a release tag, expected something like v1.2.3"
            exit 1
          fi

      - name: Check the tag is on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$TAG does not point at a commit on main, so it is not a released state"
            exit 1
          fi
          echo "$TAG is on main"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check the pom agrees with the tag
        run: |
          version=$(mvn --batch-mode --no-transfer-progress help:evaluate \
            -Dexpression=project.version -q -DforceStdout)
          if [ "$TAG" != "v$version" ]; then
            echo "the tag says $TAG but the pom says $version"
            exit 1
          fi
          echo "the pom agrees: $version"

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress --strict-checksums verify

      - name: Check the jar is runnable and carries its bootstrap
        run: |
          java -jar target/echojar.jar list > /dev/null
          unzip -l target/echojar.jar | grep -q 'echojar-bootstrap.jar'

      - name: Check the build is reproducible
        run: |
          first=$(sha256sum target/echojar.jar | cut -d' ' -f1)
          mvn --batch-mode --no-transfer-progress --strict-checksums clean package -DskipTests
          second=$(sha256sum target/echojar.jar | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            echo "this release cannot be verified by rebuilding, the two jars differ"
            exit 1
          fi
          echo "rebuild is byte for byte identical: $first"

      - name: Attest that this jar was built by this workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/echojar.jar

      - name: Publish to Maven Central
        if: env.MAVEN_USERNAME != ''
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode --no-transfer-progress --strict-checksums \
            -Prelease deploy -DskipTests

      - name: Say that Maven Central was skipped
        if: env.MAVEN_USERNAME == ''
        run: |
          echo "No MAVEN_USERNAME secret is set, so this release goes to GitHub only."
          echo "Add MAVEN_USERNAME, MAVEN_PASSWORD, GPG_PRIVATE_KEY and GPG_PASSPHRASE"
          echo "to publish to Maven Central as well."

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum target/echojar.jar | sed 's| .*/| |' > target/echojar.jar.sha256

          notes=--generate-notes

          if [ -f CHANGELOG.md ]; then
            awk -v want="${TAG#v}" '
              /^## / {
                if (found) exit
                heading = $0
                sub(/^## +/, "", heading)
                sub(/^\[/, "", heading)
                if (index(heading, want) == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > release-notes.md

            if [ -s release-notes.md ]; then
              notes="--notes-file=release-notes.md"
            fi
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            "$notes" \
            target/echojar.jar \
            target/echojar.jar.sha256
