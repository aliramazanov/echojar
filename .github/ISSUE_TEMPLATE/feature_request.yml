name: Feature request
description: Suggest something echojar should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve
      description: Describe the situation, not the solution you have in mind
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like echojar to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead
    validations:
      required: false
